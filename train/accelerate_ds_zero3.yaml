# =============================================================
# Accelerate + DeepSpeed ZeRO-3 Configuration
# =============================================================
# This YAML is passed to `accelerate launch --config_file` and
# tells Accelerate to use DeepSpeed with ZeRO Stage 3 for full
# model sharding across GPUs.
#
# Key settings:
#   - zero_stage: 3          -> shard model params + gradients + optimizer states
#   - zero3_save_16bit_model -> save consolidated bf16 weights at checkpoints
#   - mixed_precision: bf16  -> use bfloat16 for forward/backward
#   - num_processes: 4       -> override with --num_processes at launch time
# =============================================================

compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
